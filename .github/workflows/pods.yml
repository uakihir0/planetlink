name: Make XCFramework
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on: [push]

jobs:
  build:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Pods XCFramework
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: all:assemblePlanetlinkXCFramework all:podPublishXCFramework -x check

      - name: Set Project Version
        run: |
          project_version=$(./gradlew version --no-daemon --console=plain -q)
          echo "PROJECT_VERSION=$project_version" >> $GITHUB_ENV

      - name: Shrink XCFramework binaries
        run: |
          set -euo pipefail
          root=./all/build/cocoapods/repository
          binaries=$(find "$root" -path '*/planetlink.framework/*' -name planetlink -type f ! -path '*/dSYMs/*')
          if [ -z "$binaries" ]; then
            echo "No framework binaries found under $root" >&2
            exit 1
          fi
          printf '%s\n' "$binaries" | while IFS= read -r f; do
            echo "before: $(du -h "$f" | cut -f1) $f"
            strip -S -x "$f"
            codesign --force --sign - "$f"
            echo "after:  $(du -h "$f" | cut -f1) $f"
          done

      - name: Commit Pods to GitHub
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.email "a.urusihara@gmail.com"
          git config --global user.name "Akihiro Urushihara"
          cd ./all/build/cocoapods/repository/
          git init
          git add --all
          git commit -m "by GitHub Action CI (SHA ${GITHUB_SHA})"
          git remote add origin https://github.com/uakihir0/planetlink-cocoapods.git
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git push -f origin HEAD:${{ env.PROJECT_VERSION }}
          git push -f origin HEAD:main
